name: Develop Build and Merge

on:
  push:
    branches: [develop]

jobs:
  build_and_merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Merge develop into release
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin
          git checkout release
          git merge origin/develop --no-ff --allow-unrelated-histories -m "Auto-merged develop into release"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git release
