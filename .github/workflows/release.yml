name: Release Snapshot

on:
  push:
    branches: [release]

jobs:
  release_snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Zip the project as snapshot
        run: |
          mkdir -p snapshots
          zip -r snapshots/project-snapshot.zip .

      - name: Commit snapshot zip (override previous)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add snapshots/project-snapshot.zip
          git commit -m "Update snapshot ZIP (overwritten)" || echo "No changes to commit"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release

      - name: Done
        run: echo "Snapshot ZIP updated in snapshots/ folder on release branch."
