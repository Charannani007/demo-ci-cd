name: Release Build and Deploy with Base64 Encoded Maven Settings

on:
  push:
    branches:
      - release

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Decode and save Maven settings.xml
        run: |
          echo "${{ secrets.MAVEN_SETTINGS_B64 }}" | base64 -d > $HOME/.m2/settings.xml

      - name: Build and Deploy with Maven using custom settings.xml
        run: |
          mvn deploy -DmuleDeploy \
            -Dver=1 \
            -Denv=dev \
            -DconnectedAppClientId=${{ secrets.CLIENT_ID }} \
            -DconnectedAppClientSecret=${{ secrets.CLIENT_SECRET }} \
            -Dgrant_type=client_credentials \
            -s $HOME/.m2/settings.xml

      - name: Package Snapshot ZIP
        run: |
          mkdir -p output
          zip -r output/project-snapshot.zip .

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-snapshot
          name: "Release Snapshot"
          body: "Auto-generated snapshot on push to release branch."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Upload snapshot ZIP to Release
        uses: softprops/action-gh-release@v1
        with:
          files: output/project-snapshot.zip
          tag_name: release-snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
