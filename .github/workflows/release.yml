name: Release Snapshot

on:
  push:
    branches: [release]

jobs:
  release_snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Zip the project as a snapshot
        run: |
          mkdir -p output
          zip -r output/project-snapshot.zip .

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-snapshot
          name: "Release Snapshot"
          body: "Auto-generated snapshot on push to release branch."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Upload snapshot ZIP to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/project-snapshot.zip
          tag_name: release-snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
