name: Release Snapshot

on:
  push:
    branches: [release]

jobs:
  release_snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Zip the project as snapshot
        run: |
          mkdir -p output
          zip -r output/project-snapshot.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-snapshot
          name: "Release Snapshot"
          body: "Latest snapshot uploaded from release branch"
          files: output/project-snapshot.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "Snapshot uploaded as GitHub Release asset."
