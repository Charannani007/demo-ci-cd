name: Release Snapshot and Deploy

on:
  push:
    branches: [release]

jobs:
  release_snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore Maven settings from secret
        run: |
          echo "${{ secrets.MAVEN_SETTINGS_B64 }}" | base64 --decode > settings.xml

      - name: Build the project
        run: mvn clean install -s settings.xml

      - name: Deploy to CloudHub
        run: >
          mvn deploy -DmuleDeploy
          -Dver=1
          -Denv=dev
          -DconnectedAppClientId=${{ secrets.CLIENT_ID }}
          -DconnectedAppClientSecret=${{ secrets.CLIENT_SECRET }}
          -Dgrant_type=client_credentials
          -s settings.xml

      - name: Zip the project as a snapshot
        run: |
          mkdir -p output
          zip -r output/project-snapshot.zip .

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-snapshot
          name: "Release Snapshot"
          body: "Auto-generated snapshot on push to release branch."
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Upload snapshot ZIP to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/project-snapshot.zip
          tag_name: release-snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Cleanup sensitive files
        run: rm settings.xml
