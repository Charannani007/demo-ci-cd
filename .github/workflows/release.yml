name: Release Snapshot

on:
  push:
    branches: [release]

jobs:
  release_snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create snapshot with timestamp
        run: |
          mkdir -p snapshots
          timestamp=$(date +'%Y%m%d-%H%M%S')
          zip_name="project-snapshot-${timestamp}.zip"
          zip -r "snapshots/$zip_name" .
          echo "ZIP_NAME=$zip_name" >> $GITHUB_ENV

      - name: Commit snapshot zip to release branch
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add "snapshots/$ZIP_NAME"
          git commit -m "Add snapshot $ZIP_NAME"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release

      - name: Done
        run: echo "✅ Snapshot $ZIP_NAME committed to snapshots/ in release branch."
